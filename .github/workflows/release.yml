# Rôle : livraison continue. Un tag de version vX.Y.Z publie l'image Docker IMMUABLE sur GHCR.
# Exécution : GitHub Actions, automatiquement quand on pousse un tag :
#   git tag -a v1.2.0 -m "Release 1.2.0" && git push origin v1.2.0
# Résultat : ghcr.io/yas-sin-e/forma3d:v1.2.0 (nom en minuscules, obligatoire pour GHCR).
# Enchaînement : test -> publish -> deploy-staging (bonus B2 : mise en service automatique sur un
# staging jetable du runner, suivie du contrôle de santé). Sur le poste, la mise en service reste
# volontaire avec scripts/deploy.sh.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Moindre privilège : lire le code et écrire UNIQUEMENT dans les paquets (GHCR) de ce dépôt.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yas-sin-e/forma3d

jobs:
  # On rejoue les contrôles et les tests : on ne publie jamais une version dont les tests échouent.
  # Même job que la CI (reusable-tests.yml), en Python 3.12 (version de l'image) et avec --strict.
  test:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      python-versions: '["3.12"]'
      strict: true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Connexion avec le jeton fourni automatiquement par GitHub pour CETTE exécution.
      # Aucun mot de passe ni jeton personnel n'est écrit dans le dépôt ou dans le journal.
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule le tag (= nom du tag Git, ex. v1.0.0) et les labels OCI de traçabilité :
      # source (dépôt), revision (commit), version.
      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=false : on ne publie JAMAIS de tag « latest » (il bouge à chaque version, donc
          # il n'est pas immuable) ; seul le tag de version exact existe.
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=forma3d
            org.opencontainers.image.description=API Forma3D Studio (FastAPI + Studio + widget)

      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Résumé
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Bonus B2 : déploiement automatique sur tag. Le runner sert de staging JETABLE (détruit à la fin
  # du job) : cela prouve que l'image publiée démarre avec sa base et passe le contrôle de santé.
  deploy-staging:
    name: deploy-staging
    runs-on: ubuntu-latest
    needs: publish
    # « environment » : GitHub trace chaque déploiement (onglet Deployments du dépôt).
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Connexion à GHCR (pour tirer l'image privée)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Même procédure que sur le poste : modèle de configuration (valeurs fictives) + version par IMAGE_TAG.
      - name: Mettre en service l'image du tag (sans reconstruire)
        run: |
          cp .env.staging.example .env.staging
          echo "IMAGE_TAG=${{ github.ref_name }}" > .env.deploy
          docker compose -p forma3d-staging -f compose.staging.yaml --env-file .env.deploy pull api
          docker compose -p forma3d-staging -f compose.staging.yaml --env-file .env.deploy up -d

      # Code non nul -> le job échoue : la version est signalée comme non déployable.
      - name: Contrôle de santé
        run: ./scripts/wait-healthy.sh

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -p forma3d-staging -f compose.staging.yaml --env-file .env.deploy logs --tail=50

      - name: Résumé
        run: echo "### Staging sain avec \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
