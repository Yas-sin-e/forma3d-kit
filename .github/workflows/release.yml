# Rôle : livraison continue. Un tag de version vX.Y.Z publie l'image Docker IMMUABLE sur GHCR.
# Exécution : GitHub Actions, automatiquement quand on pousse un tag :
#   git tag -a v1.0.0 -m "Release 1.0.0" && git push origin v1.0.0
# Résultat : ghcr.io/yas-sin-e/forma3d:v1.0.0 (nom en minuscules, obligatoire pour GHCR).
# La mise en service reste VOLONTAIRE (scripts/deploy.sh) : livraison continue, pas déploiement continu.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Moindre privilège : lire le code et écrire UNIQUEMENT dans les paquets (GHCR) de ce dépôt.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/yas-sin-e/forma3d

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: "true"
      HF_SPACE_ID: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Installer les dépendances
        run: python -m pip install -r backend/requirements.txt
      # On rejoue les contrôles : on ne publie jamais une version dont les tests échouent.
      - name: Contrôler le dépôt
        run: ./scripts/check-project.sh --strict
      - name: Lancer les tests
        working-directory: backend
        run: python -m pytest -q

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Connexion avec le jeton fourni automatiquement par GitHub pour CETTE exécution.
      # Aucun mot de passe ni jeton personnel n'est écrit dans le dépôt ou dans le journal.
      - name: Connexion à GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Calcule le tag (= nom du tag Git, ex. v1.0.0) et les labels OCI de traçabilité :
      # source (dépôt), revision (commit), version.
      - name: Métadonnées de l'image
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=forma3d
            org.opencontainers.image.description=API Forma3D Studio (FastAPI + Studio + widget)

      - name: Construire et publier
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Résumé
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.tags }}\`" >> "$GITHUB_STEP_SUMMARY"
