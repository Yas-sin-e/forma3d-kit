# Rôle : pipeline d'intégration continue (CI) de Forma3D : tests puis construction de l'image Docker.
# Exécution : GitHub Actions, automatiquement à chaque pull request et à chaque push sur main.
# Enchaînement : job « test » -> (needs) -> job « docker-build ». Si « test » est rouge,
# « docker-build » ne démarre pas : on ne construit jamais une image à partir d'un code qui échoue.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Moindre privilège : le jeton GitHub du pipeline peut seulement LIRE le dépôt.
permissions:
  contents: read

# Une nouvelle exécution sur la même branche annule la précédente (économise les minutes gratuites).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Le job de tests est défini UNE seule fois dans reusable-tests.yml (aussi appelé par release.yml).
  # Bonus B3, matrice de versions : 3.12 = version de l'image Docker (production) ;
  # 3.13 = version suivante (compatibilité future). Rapport JUnit publié en artefact.
  # Noms des contrôles affichés : « test / test (Python 3.12) » et « test / test (Python 3.13) ».
  test:
    uses: ./.github/workflows/reusable-tests.yml
    with:
      python-versions: '["3.12", "3.13"]'
      junit-report: true

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: test
    # L'application exige PostgreSQL : le test de fumée a besoin d'une base, comme en production.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forma3d
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: forma3d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forma3d -d forma3d"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v4

      # push: false : la CI vérifie que l'image se construit ; la publication est le rôle de release.yml.
      # load: true : l'image est chargée dans le Docker du runner pour le test de fumée ci-dessous.
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: forma3d:ci

      # Test de fumée : l'image démarre-t-elle vraiment et répond-elle sur /health ?
      - name: Test de fumée /health
        run: |
          # --network host : le conteneur joint la base du service sur localhost:5432 du runner,
          # et l'API répond sur localhost:8080 sans publication de port.
          docker run -d --name smoke --network host \
            -e DATABASE_URL=postgresql://forma3d:ci-password@localhost:5432/forma3d \
            forma3d:ci
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:8080/health; then echo; echo "image saine"; exit 0; fi
            sleep 5
          done
          echo "image non saine" >&2
          docker logs smoke >&2
          exit 1
