# Vérifie les documents requis et exécute les tests du backend à chaque changement.
name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  project-checks:
    name: Documents and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Verify required project files
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENTS.md
          test -f PRODUCT.md
          test -f DESIGN.md
          test -f docs/ETAT.md
          test -f docs/STRUCTURE.md
          test -f docs/etapes/etape-01.md
          test -f .env.example
          test -f backend/requirements.txt
          test -f backend/app/main.py
          test -f backend/tests/test_health.py
          test -f backend/README.md
          test -f frontend/README.md
