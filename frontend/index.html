<!--
  Rôle : héberge la navigation persistante et le point de montage des pages du Studio.
  Exécution : FastAPI sert cette coque ; router.js affiche la page correspondant au hash.
-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0E1218">
    <meta name="description" content="Créez et consultez des modèles 3D de produits avec Forma3D Studio.">
    <title>Forma3D Studio — Créer</title>
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <script type="module" src="/static/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Aller au contenu</a>
    <header class="site-header">
      <a class="brand" href="#/creer" aria-label="Forma3D Studio, accueil">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="m16 3 11 6.2v13.6L16 29 5 22.8V9.2L16 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="m5.5 9.5 10.5 6 10.5-6M16 15.5V28" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>Forma3D <span class="brand-light">Studio</span></span>
      </a>
      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="header-nav" id="main-nav" aria-label="Navigation principale">
        <a href="#/creer" data-nav="create">Créer</a>
        <a href="#/modeles" data-nav="models">Mes modèles</a>
        <a href="#/categories" data-nav="categories">Catégories</a>
        <a href="#/exemples" data-nav="examples">Exemples</a>
      </nav>
      <span class="provider-badge" id="provider-badge" data-status="checking" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="provider-label">Serveur 3D : vérification…</span>
      </span>
    </header>

    <main id="app" tabindex="-1" aria-live="off"></main>

    <footer class="site-footer">
      <span>Forma3D Studio</span>
      <span>Prototype de démonstration · Aucun entraînement de modèle</span>
    </footer>
  </body>
</html>
